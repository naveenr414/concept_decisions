name: concept-selection
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  # Python
  - python=3.10

  # PyTorch (CUDA 12.1)
  - pytorch
  - torchaudio
  - torchvision
  - pytorch-cuda=12.1

  # Scientific
  - numpy
  - scipy
  - scikit-learn
  - ujson

  # Visualization
  - matplotlib
  - seaborn

  # Jupyter
  - jupytext
  - jupyter
  - ipykernel

  # pip-only packages
  - pip
  - pip:
    - stable-baselines3
    - gymnasium
    - gymnasium[classic-control]
    - ocatari
    - minigrid
    - simglucose
    - gurobipy
    - opencv-python-headless
    - jupytext